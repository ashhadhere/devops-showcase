name: EKS Terraform validation
on:
  pull_request:
    paths: ['projects/aws-eks/**', '.github/workflows/eks-terraform.yml']
  push:
    branches: [main]
    paths: ['projects/aws-eks/**', '.github/workflows/eks-terraform.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eks-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/aws-eks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.59.1
      - name: Install security scanner
        run: python -m pip install checkov==3.2.495
      - name: Format, validate, test, lint and scan
        run: bash scripts/check.sh
